<!DOCTYPE html>
<title>Task 2</title>
<script src="script.mjs" type="module" defer></script>
<style>
  body {
    display: flex;
    flex-flow: column;
    align-items: center;
  }

  article {
    display: flex;
    flex-flow: row wrap;
  }

  svg.timer:hover circle {
    animation: 0.001s linear 1s infinite reverse fillCircle;
  }

  svg.timer {
    width: 8em;

    circle {
      fill: none;
      stroke: grey;
      stroke-width: 1em;

      transform: rotate(-90deg);
      transform-origin: center;

      animation: 1s linear 1s infinite reverse fillCircle;
    }

    circle.finished {
      animation: none;
      stroke: greenyellow;
    }
  }

  @keyframes fillCircle {
    5% {
      stroke-dasharray: 0 283;
    }

    100% {
      stroke-dasharray: 283 283;
    }
  }

  figure {
    width: 30em;
    height: 20em;
  }
</style>
<!-- -->
<h1>Lorry Loading</h1>
<sub>4Core Logistics Ltd</sub>
<article>
  <figure>
    <svg class="timer" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <circle cx="100" cy="100" r="45"></circle>
    </svg>
    <canvas></canvas>
  </figure>
  <section>

  </section>
</article>
