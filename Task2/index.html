<style>
  /* Set the base styles for the timer */
  svg.timer {
    width: 1em;
    vertical-align: text-top;

    circle {
      fill: none;
      stroke: grey;
      stroke-width: 1em;

      transform: rotate(-90deg);
      transform-origin: center;

      animation: 0.25s infinite linear reverse fillCircle;
      animation-play-state: paused;
    }

    circle.finished {
      animation: none;
      stroke: greenyellow;
    }
  }

  label:has(input[type='checkbox']) {
    font-size: 2em;
    input {
      display: none;

      ~svg circle {
        animation-play-state: paused;
      }
    }

    input:checked~svg circle {
      animation-play-state: running;
    }
  }

  label:has(input[type='checkbox']):hover {
    color: grey;
  }

  article {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  figure {
    width: 30em;
    height: 20em;
  }

  @keyframes fillCircle {
    5% {
      stroke-dasharray: 0 283;
    }

    100% {
      stroke-dasharray: 283 283;
    }
  }

  figure {
    width: 30em;
    height: 20em;
  }

  .truckRect {
    stroke: black;
    fill: white;
    stroke-width: 2px;
  }

  .wheel {
    fill: grey;
    stroke: black;
    stroke-width: 2px;
  }

  .boxSlot {
    stroke: black;
    stroke-dasharray: 6,6;
    fill: white;
  }

  .hidden {
    display: none;
  }
</style>
